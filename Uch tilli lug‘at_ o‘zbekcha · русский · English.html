.bar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.bar+.bar{margin-top:6px}
.bar .lab{align-self:center;color:var(--muted);font-size:.85rem;margin-right:4px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 .88rem var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tile);border-color:var(--tile);color:#fff}
.chip.cat[aria-pressed="true"]{background:var(--turq);border-color:var(--turq);color:#04201d}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.count{color:var(--muted);font-size:.9rem;margin:14px 2px 10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--turq);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
li:nth-child(3n+2){border-left-color:var(--saffron)}
li:nth-child(3n){border-left-color:var(--tile2)}
.w{display:flex;flex-direction:column;gap:2px;min-width:0}
.w small{color:var(--muted);font-weight:800;font-size:.72rem}
.w b{font-family:var(--serif);font-size:1.3rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.w.first b{font-size:1.5rem}
.w.first small{color:var(--turq)}
.say{align-self:flex-start;margin-top:4px;border:0;background:var(--soft);color:var(--ink);border-radius:8px;padding:3px 9px;font:700 .78rem var(--sans);cursor:pointer}
mark{background:var(--saffron);color:#2a1d00;border-radius:3px;padding:0 1px}

function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hl(s,t){
  if(!t)return esc(s);

  if(i<0||n.length!==s.length)return esc(s);

}
function say(text,lang){

  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;speechSynthesis.speak(u)}catch(e){}
}
function render(){

  rows.forEach(function(d){
    var li=document.createElement("li");
    order.forEach(function(k,pos){

    });
    ul.appendChild(li);
  });
}
